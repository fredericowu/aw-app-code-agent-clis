name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ${{ fromJSON(startsWith(github.repository, 'tekflox/') && '["self-hosted","aw-baremetal"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pytest jsonschema fastapi httpx uvicorn
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tekflox/aw-marketplace
          path: .aw-marketplace-schema
      - name: Validate manifest
        run: python3 tests/validate_manifest.py aw-app.json --schema .aw-marketplace-schema/schemas/aw-app.schema.json
      - name: Run pytest
        run: pytest tests/ -q
